name: backend
description: MamaCare backend implemented in Dart using shelf and postgres
version: 1.0.0
environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  shelf: ^1.4.0
  shelf_router: ^1.0.0
  shelf_cors_headers: ^0.1.5
  postgres: ^2.5.4
  dotenv: any
  # Use 'any' to allow resolving a compatible dotenv package in this environment.
  dart_jsonwebtoken: ^2.4.1
  crypto: ^3.0.2
  supabase: ^0.3.0
  uuid: ^3.0.6
  logging: ^1.0.2
  async: ^2.10.0

dev_dependencies:
  pedantic: ^1.11.0
